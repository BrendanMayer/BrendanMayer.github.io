---
layout: default
---

<article class="post-shell">
  <div class="container">
    <div class="prose">
      <header>
        <div class="post-meta">
          <span>{{ page.date | date: "%b %-d, %Y" }}</span>

          {% if page.tags %}
            <span>·</span>
            <span>{{ page.tags | join: " · " }}</span>
          {% endif %}
        </div>

        <h1>{{ page.title }}</h1>

        {% if page.excerpt %}
          <p>{{ page.excerpt }}</p>
        {% endif %}

        {% if page.image %}
          <img src="{{ page.image }}" alt="{{ page.title }}">
        {% endif %}
      </header>

      {{ content }}
    </div>
  </div>
</article>

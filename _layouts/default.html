<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>

  <meta
    name="description"
    content="{{ page.excerpt | default: page.description | default: site.description | strip_html | strip_newlines | escape }}"
  >

  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/assets/style.css">

  <script src="/assets/main.js" defer></script>
</head>

<body>
  <header class="headerbar">
    <nav class="nav container">
      <a class="brand" href="/">Brendan Mayer</a>

      <ul>
        <li><a href="/blog/" {% if page.url contains "/blog/" %}class="active"{% endif %}>Blog</a></li>
        <li><a href="/projects/" {% if page.url contains "/projects/" %}class="active"{% endif %}>Projects</a></li>
        <li><a href="/about/" {% if page.url contains "/about/" %}class="active"{% endif %}>About</a></li>
        <li><a href="/contact/" {% if page.url contains "/contact/" %}class="active"{% endif %}>Contact</a></li>
        <li><a href="https://commits.brendanmayer.dev">Commits Tracker</a></li>
      </ul>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="footer container">
    <p>© {{ site.time | date: "%Y" }} Brendan Mayer</p>
  </footer>
</body>
</html>

---
layout: default
---

<article class="post-shell">
  <div class="container">
    <div class="prose">
      <header>
        <div class="post-meta">
          <span>{{ page.date | date: "%b %-d, %Y" }}</span>

          {% if page.tags %}
            <span>·</span>
            <span>{{ page.tags | join: " · " }}</span>
          {% endif %}
        </div>

        <h1>{{ page.title }}</h1>

        {% if page.excerpt %}
          <p>{{ page.excerpt }}</p>
        {% endif %}
      </header>
    </div>

    {% if page.image %}
      <figure class="post-hero-wide">
        <a href="{{ page.image }}">
          <img src="{{ page.image }}" alt="{{ page.title }}">
        </a>
        <figcaption>Click the image to view it full size.</figcaption>
      </figure>
    {% endif %}

    <div class="prose">
      {{ content }}
    </div>
  </div>
</article>
